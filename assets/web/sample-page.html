<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- tools/shoot.cjs の見本用のページ。実際のデッキでは、紹介したい Web サービスの URL を shots.config.cjs に書く -->
<title>見本のページ</title>
<style>
  body { margin: 0; background: #f4f4f1; font: 500 16px/1.7 "Zen Kaku Gothic New", "Noto Sans JP", sans-serif; color: #222; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px; }
  h1 { font-size: 34px; margin: 0 0 6px; }
  .lede { color: #555; margin: 0 0 24px; }
  nav { display: flex; gap: 4px; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
  nav button { font: inherit; background: none; border: 0; padding: 10px 18px; border-bottom: 3px solid transparent; cursor: pointer; }
  nav button[aria-pressed="true"] { border-color: #1d5c4d; font-weight: 700; color: #1d5c4d; }
  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input { flex: 1; font: inherit; padding: 8px 12px; border: 1px solid #bbb; }
  .search button { font: inherit; padding: 8px 16px; background: #1d5c4d; color: #fff; border: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: #fff; border: 1px solid #ddd; padding: 12px 16px; margin-bottom: 8px; }
  li b { display: block; }
</style>
</head><body>
<div class="wrap">
  <h1>見本のサービス</h1>
  <p class="lede">tools/shoot.cjs で枠と吹き出しを付ける見本です。</p>
  <nav id="tabs"><button aria-pressed="true">一覧</button><button aria-pressed="false">検索</button><button aria-pressed="false">設定</button></nav>
  <div class="search"><input placeholder="キーワードで探す"><button>検索</button></div>
  <ul id="list">
    <li><b>1件目のタイトル</b>説明が入ります。</li>
    <li><b>2件目のタイトル</b>説明が入ります。</li>
    <li><b>3件目のタイトル</b>説明が入ります。</li>
  </ul>
</div>
</body></html>
